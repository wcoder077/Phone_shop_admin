{% extends "base.html" %}

{% block content %}

<div class="container py-4">
    <a href="{% url 'purchase_view' %}" class="btn btn-secondary"> ← Orqaga </a>

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">

                <!-- HEADER -->
                <div class="card-header bg-white">
                    <h5 class="mb-0">➕ Ma’lumot qo‘shish</h5>
                </div>

                <!-- BODY -->
                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            💾 Saqlash
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
