{% extends "base.html" %}
{% load widget_tweaks %}

{% block content %}
<div class="container mt-4">
    <div class="w-100 d-flex justify-content-start">
        <a href="{% url 'home' %}" class="btn btn-secondary">Orqaga</a>
    </div>

    <form method="POST" enctype="multipart/form-data" class="w-50 mx-auto mt-5 p-5 shadow-sm bg-white rounded">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="mb-3">
            {{ field.label_tag }}
            {{ field|add_class:"form-control" }}
            
            {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary w-100" onclick="return confirm('Saqlaysizmi?')">
            Saqlash
        </button>
    </form>
</div>
{% endblock content %}
